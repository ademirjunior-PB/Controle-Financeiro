    <script>
        const DEFAULT_SUBTEXT = "A sua liberdade financeira começa hoje.";
        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        const firebaseConfig = {
            apiKey: "AIzaSyCykfYieUDo_LU5t16yj8JTt-Fsiidb9J4",
            authDomain: "aj-connectpb.firebaseapp.com",
            projectId: "aj-connectpb",
            storageBucket: "aj-connectpb.firebasestorage.app",
            messagingSenderId: "280670991097",
            appId: "1:280670991097:web:14a71c57219a1b7814e828"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        googleProvider.addScope('profile');
        googleProvider.addScope('email');

        let firebaseUser = null;
        let userProfile = null;
        let currentDate = new Date();

        const DEFAULT_TRANSACTIONS = [
            { id: '1', type: 'income', desc: 'Salário', amount: 4500, category: 'Salário', paymentMethod: 'Pix', date: new Date().toISOString().split('T')[0] },
            { id: '2', type: 'expense', desc: 'Mercado', amount: 650, category: 'Alimentação', paymentMethod: 'Débito', date: new Date().toISOString().split('T')[0] }
        ];
        const DEFAULT_FIXED = [
            { id: 'f1', desc: 'Aluguel', amount: 1200, category: 'Moradia', day: 10, paymentMethod: 'Pix' },
            { id: 'f2', desc: 'Internet', amount: 100, category: 'Moradia', day: 15, paymentMethod: 'Pix' }
        ];
        const DEFAULT_CATEGORIES = [
            { id: 'c1', name: 'Alimentação', color: '#f59e0b', limit: 1000 },
            { id: 'c2', name: 'Moradia', color: '#3b82f6', limit: 1500 },
            { id: 'c3', name: 'Transporte', color: '#8b5cf6', limit: 400 },
            { id: 'c4', name: 'Lazer', color: '#ec4899', limit: 300 },
            { id: 'c5', name: 'Salário', color: '#10b981', limit: 0 }
        ];
        const DEFAULT_GOALS = [
            { id: 'g1', title: 'Reserva de Emergência', target: 10000, current: 3500, deadline: '2026-12-31' }
        ];

        let state = {
            transactions: [],
            fixedExpenses: [],
            categories: [],
            goals: [],
            currentTxType: 'expense',
            chart: null,
            annualChart: null
        };

        function getStorageKey(key) {
            if (key === 'finflow_theme') return key;
            return firebaseUser ? `${key}_${firebaseUser.uid}` : `finflow_guest_${key}`;
        }

        function setCookie(name, value, days = 365) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
        }

        function getCookie(name) {
            return document.cookie.split('; ').reduce((r, v) => {
                const parts = v.split('=');
                return parts[0] === name ? decodeURIComponent(parts.slice(1).join('=')) : r;
            }, '');
        }

        function getStoredData(key) {
            const storageKey = getStorageKey(key);
            const local = localStorage.getItem(storageKey);
            if (local !== null) return local;
            return getCookie(storageKey) || null;
        }

        function saveStoredData(key, value) {
            const storageKey = getStorageKey(key);
            localStorage.setItem(storageKey, value);
            setCookie(storageKey, value);
        }

        function hasUserData() {
            return !!(firebaseUser && localStorage.getItem(getStorageKey('finflow_user')));
        }

        function loadUserData() {
            if (!firebaseUser) return;

            const readJson = (key, fallback) => {
                try {
                    const value = getStoredData(key);
                    return value ? JSON.parse(value) : fallback;
                } catch (_) {
                    return fallback;
                }
            };

            const migrationKey = 'finflow_legacy_migration_done';
            if (!localStorage.getItem(migrationKey) && !localStorage.getItem(getStorageKey('finflow_user'))) {
                const legacyProfile = localStorage.getItem('finflow_user');
                const legacyTxs = localStorage.getItem('finflow_txs');
                const legacyFixed = localStorage.getItem('finflow_fixed');
                const legacyCats = localStorage.getItem('finflow_cats');
                const legacyGoals = localStorage.getItem('finflow_goals');

                if (legacyProfile || legacyTxs || legacyFixed || legacyCats || legacyGoals) {
                    if (legacyProfile) saveStoredData('finflow_user', legacyProfile);
                    if (legacyTxs) saveStoredData('finflow_txs', legacyTxs);
                    if (legacyFixed) saveStoredData('finflow_fixed', legacyFixed);
                    if (legacyCats) saveStoredData('finflow_cats', legacyCats);
                    if (legacyGoals) saveStoredData('finflow_goals', legacyGoals);
                    if (localStorage.getItem('finflow_setup_completed')) saveStoredData('finflow_setup_completed', 'true');
                }
                localStorage.setItem(migrationKey, 'true');
            }

            userProfile = readJson('finflow_user', null);
            state.transactions = readJson('finflow_txs', DEFAULT_TRANSACTIONS.map(item => ({ ...item })));
            state.fixedExpenses = readJson('finflow_fixed', DEFAULT_FIXED.map(item => ({ ...item })));
            state.categories = readJson('finflow_cats', DEFAULT_CATEGORIES.map(item => ({ ...item })));
            state.goals = readJson('finflow_goals', DEFAULT_GOALS.map(item => ({ ...item })));
        }

        function syncFirebaseProfile() {
            if (!firebaseUser) return;
            const googleName = firebaseUser.displayName || 'Usuário';
            const existing = userProfile || {};
            userProfile = {
                uid: firebaseUser.uid,
                name: existing.name || googleName,
                subtext: existing.subtext || DEFAULT_SUBTEXT,
                email: firebaseUser.email || existing.email || '',
                photoURL: firebaseUser.photoURL || existing.photoURL || ''
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            initDarkModeUI();
            initChart();

            // Trata o resultado de um redirecionamento (caso o navegador tenha usado Redirect)
            auth.getRedirectResult()
                .then(result => {
                    if (result && result.user) {
                        console.log('Login efetuado via Redirect:', result.user.uid);
                    }
                })
                .catch(err => {
                    console.error('Erro no retorno do Redirect:', err);
                    const status = document.getElementById('authStatus');
                    if (status) status.innerText = getFirebaseAuthError(err);
                });

            // Escuta as alterações no estado de autenticação
            auth.onAuthStateChanged(handleAuthStateChanged);
        });

        async function handleAuthStateChanged(user) {
            firebaseUser = user;

            if (!user) {
                userProfile = null;
                document.getElementById('welcomeScreen').classList.remove('hidden');
                document.getElementById('authLoginArea').classList.remove('hidden');
                document.getElementById('profileSetupForm').classList.add('hidden');
                document.getElementById('authStatus').innerText = '';
                return;
            }

            loadUserData();
            syncFirebaseProfile();
            saveStoredData('finflow_user', JSON.stringify(userProfile));

            if (!hasUserData() || !getStoredData('finflow_setup_completed')) {
                showProfileSetup();
            } else {
                document.getElementById('welcomeScreen').classList.add('hidden');
                updateHeaderProfile();
            }

            renderAll();
            const txDate = document.getElementById('txDate');
            if (txDate) txDate.value = new Date().toISOString().split('T')[0];
        }

        function showProfileSetup() {
            const user = firebaseUser;
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('authLoginArea').classList.add('hidden');
            document.getElementById('profileSetupForm').classList.remove('hidden');
            document.getElementById('setupGoogleName').innerText = user.displayName || 'Conta Google';
            document.getElementById('setupGoogleEmail').innerText = user.email || '';
            document.getElementById('setupUserName').value = userProfile?.name || user.displayName || '';
            document.getElementById('setupUserSubtext').value = userProfile?.subtext || DEFAULT_SUBTEXT;

            const photo = document.getElementById('setupGooglePhoto');
            if (user.photoURL) {
                photo.src = user.photoURL;
                photo.classList.remove('hidden');
            } else {
                photo.classList.add('hidden');
            }
        }

        let authMode = 'login';

        function showAuthMode(mode) {
            authMode = mode;
            const loginTab = document.getElementById('authTabLogin');
            const registerTab = document.getElementById('authTabRegister');
            const button = document.getElementById('emailAuthButton');
            const forgot = document.getElementById('forgotPasswordButton');
            const password = document.getElementById('authPassword');

            loginTab.className = mode === 'login'
                ? 'flex-1 py-2 rounded-xl bg-white dark:bg-gray-700 shadow-sm text-[11px] font-bold text-brand-600 dark:text-brand-400'
                : 'flex-1 py-2 rounded-xl text-[11px] font-bold text-gray-500 dark:text-gray-400';
            registerTab.className = mode === 'register'
                ? 'flex-1 py-2 rounded-xl bg-white dark:bg-gray-700 shadow-sm text-[11px] font-bold text-brand-600 dark:text-brand-400'
                : 'flex-1 py-2 rounded-xl text-[11px] font-bold text-gray-500 dark:text-gray-400';

            button.innerText = mode === 'login' ? 'Entrar' : 'Criar minha conta';
            forgot.classList.toggle('hidden', mode !== 'login');
            password.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
            document.getElementById('authStatus').innerText = '';
        }

        function toggleAuthPassword() {
            const input = document.getElementById('authPassword');
            const icon = document.getElementById('authPasswordIcon');
            const visible = input.type === 'text';
            input.type = visible ? 'password' : 'text';
            icon.className = visible ? 'fas fa-eye text-xs' : 'fas fa-eye-slash text-xs';
        }

        function getAuthCredentials() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!email || !password) {
                throw new Error('Informe seu e-mail e sua senha.');
            }
            return { email, password };
        }

        async function submitEmailAuth() {
            const status = document.getElementById('authStatus');
            const button = document.getElementById('emailAuthButton');
            try {
                const { email, password } = getAuthCredentials();
                button.disabled = true;
                button.classList.add('opacity-60');
                status.innerText = authMode === 'login' ? 'Entrando...' : 'Criando sua conta...';

                if (authMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    const credential = await auth.createUserWithEmailAndPassword(email, password);
                    await credential.user.updateProfile({ displayName: email.split('@')[0] });
                }
            } catch (error) {
                console.error(error);
                const messages = {
                    'auth/invalid-email': 'Informe um e-mail válido.',
                    'auth/user-not-found': 'Não existe uma conta com este e-mail.',
                    'auth/wrong-password': 'Senha incorreta.',
                    'auth/invalid-credential': 'E-mail ou senha incorretos.',
                    'auth/email-already-in-use': 'Este e-mail já possui uma conta.',
                    'auth/weak-password': 'A senha deve ter pelo menos 6 caracteres.',
                    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
                    'auth/network-request-failed': 'Falha de conexão. Verifique sua internet.'
                };
                status.innerText = messages[error.code] || error.message || 'Não foi possível concluir o acesso.';
            } finally {
                button.disabled = false;
                button.classList.remove('opacity-60');
            }
        }

        async function resetPassword() {
            const status = document.getElementById('authStatus');
            const email = document.getElementById('authEmail').value.trim();
            if (!email) {
                status.innerText = 'Digite seu e-mail para receber o link de redefinição.';
                document.getElementById('authEmail').focus();
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                status.innerText = 'Link de redefinição enviado para seu e-mail.';
            } catch (error) {
                console.error(error);
                status.innerText = error.code === 'auth/user-not-found' ? 'Não existe uma conta com este e-mail.' : (error.message || 'Não foi possível enviar o e-mail.');
            }
        }

        function getFirebaseAuthError(error) {
            const messages = {
                'auth/popup-blocked': 'O navegador bloqueou a janela do Google. Tente novamente.',
                'auth/popup-closed-by-user': 'A janela de login foi fechada antes de concluir.',
                'auth/cancelled-popup-request': 'O login anterior foi cancelado.',
                'auth/account-exists-with-different-credential': 'Já existe uma conta com este e-mail usando outro método de login.',
                'auth/unauthorized-domain': 'Este domínio ainda não está autorizado no Firebase Authentication.',
                'auth/operation-not-allowed': 'O login com Google não está ativado no Firebase.',
                'auth/network-request-failed': 'Falha de conexão. Verifique sua internet e tente novamente.'
            };
            return messages[error?.code] || `Não foi possível entrar com Google${error?.message ? ': ' + error.message : '.'}`;
        }

        async function signInWithGoogle() {
            const status = document.getElementById('authStatus');
            const button = document.getElementById('googleAuthButton');
            if (button) button.disabled = true;
            status.innerText = 'Autenticando com o Google...';

            try {
                // Tenta Popup em todas as plataformas primeiro para garantir a continuidade do localStorage na mesma sessão
                await auth.signInWithPopup(googleProvider);
            } catch (error) {
                console.warn('Falha no Popup. Tentando Redirect como alternativa...', error);

                // Se o popup falhar ou for bloqueado pelo sistema, utiliza Redirect como fallback
                if (['auth/popup-blocked', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error?.code)) {
                    try {
                        status.innerText = 'Redirecionando para o Google...';
                        await auth.signInWithRedirect(googleProvider);
                        return;
                    } catch (redirectError) {
                        console.error('Erro no Redirect Fallback:', redirectError);
                        status.innerText = getFirebaseAuthError(redirectError);
                    }
                } else {
                    status.innerText = getFirebaseAuthError(error);
                }
            } finally {
                if (button) button.disabled = false;
            }
        }

        async function signOutUser() {
            try {
                closeAllModals();
                await auth.signOut();
            } catch (error) {
                console.error(error);
                alert('Não foi possível sair da conta. Tente novamente.');
            }
        }

        function forceAppUpdate() {
            if (confirm("Deseja buscar a versão mais recente do aplicativo? Seus dados continuarão salvos.")) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for (let registration of registrations) registration.unregister();
                    });
                }
                if ('caches' in window) {
                    caches.keys().then(names => names.forEach(name => caches.delete(name)));
                }
                window.location.reload(true);
            }
        }

        function exportBackupData() {
            const dataToExport = {
                userProfile: userProfile,
                transactions: state.transactions,
                fixedExpenses: state.fixedExpenses,
                categories: state.categories,
                goals: state.goals,
                exportDate: new Date().toISOString()
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchor = document.createElement('a');
            const fileName = `AJ-MyFinance_Backup_${new Date().toISOString().split('T')[0]}.json`;
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackupData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData.transactions && importedData.categories) {
                        userProfile = {
                            ...userProfile,
                            ...(importedData.userProfile || {}),
                            uid: firebaseUser?.uid || userProfile?.uid,
                            email: firebaseUser?.email || userProfile?.email,
                            photoURL: firebaseUser?.photoURL || userProfile?.photoURL || ''
                        };
                        state.transactions = importedData.transactions || [];
                        state.fixedExpenses = importedData.fixedExpenses || [];
                        state.categories = importedData.categories || [];
                        state.goals = importedData.goals || [];

                        saveStoredData('finflow_user', JSON.stringify(userProfile));
                        saveStoredData('finflow_setup_completed', 'true');
                        saveData();
                        updateHeaderProfile();

                        alert('Backup restaurado com sucesso!');
                        closeAllModals();
                    } else {
                        alert('Arquivo de backup inválido.');
                    }
                } catch (err) {
                    alert('Erro ao carregar arquivo de backup.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        function saveUserProfile(e) {
            e.preventDefault();
            const name = document.getElementById('setupUserName').value.trim();
            const subtext = document.getElementById('setupUserSubtext').value.trim() || DEFAULT_SUBTEXT;
            if (!name || !firebaseUser) return;

            userProfile = {
                uid: firebaseUser.uid,
                name,
                subtext,
                email: firebaseUser.email || '',
                photoURL: firebaseUser.photoURL || ''
            };
            saveStoredData('finflow_user', JSON.stringify(userProfile));
            saveStoredData('finflow_setup_completed', 'true');
            document.getElementById('welcomeScreen').classList.add('hidden');
            updateHeaderProfile();
        }

        function updateHeaderProfile() {
            if (!userProfile || !firebaseUser) return;
            document.getElementById('headerGreeting').innerText = `Olá, ${userProfile.name}!`;
            document.getElementById('headerSubtext').innerText = userProfile.subtext || DEFAULT_SUBTEXT;

            const image = document.getElementById('userAvatarImage');
            const initial = document.getElementById('userAvatarInitial');
            if (userProfile.photoURL) {
                image.src = userProfile.photoURL;
                image.classList.remove('hidden');
                initial.classList.add('hidden');
            } else {
                image.classList.add('hidden');
                initial.classList.remove('hidden');
                initial.innerText = (userProfile.name || 'U').charAt(0).toUpperCase();
            }

            const profilePhoto = document.getElementById('profileGooglePhoto');
            const profileName = document.getElementById('profileGoogleName');
            const profileEmail = document.getElementById('profileGoogleEmail');
            profileName.innerText = firebaseUser.displayName || userProfile.name || 'Conta Google';
            profileEmail.innerText = firebaseUser.email || '';
            if (userProfile.photoURL) {
                profilePhoto.src = userProfile.photoURL;
                profilePhoto.classList.remove('hidden');
            } else {
                profilePhoto.classList.add('hidden');
            }
        }

        function openProfileModal() {
            if (!firebaseUser) return;
            if (userProfile) {
                document.getElementById('editUserName').value = userProfile.name || firebaseUser.displayName || '';
                document.getElementById('editUserSubtext').value = userProfile.subtext || DEFAULT_SUBTEXT;
            }
            updateHeaderProfile();
            openModal('profileModal');
        }

        function updateUserProfile(e) {
            e.preventDefault();
            const name = document.getElementById('editUserName').value.trim();
            const subtext = document.getElementById('editUserSubtext').value.trim() || DEFAULT_SUBTEXT;
            if (!name || !firebaseUser) return;

            userProfile = {
                ...userProfile,
                uid: firebaseUser.uid,
                name,
                subtext,
                email: firebaseUser.email || '',
                photoURL: firebaseUser.photoURL || userProfile?.photoURL || ''
            };
            saveStoredData('finflow_user', JSON.stringify(userProfile));
            saveStoredData('finflow_setup_completed', 'true');
            updateHeaderProfile();
            closeAllModals();
        }

        function saveData() {
            if (!firebaseUser) return;
            saveStoredData('finflow_txs', JSON.stringify(state.transactions));
            saveStoredData('finflow_fixed', JSON.stringify(state.fixedExpenses));
            saveStoredData('finflow_cats', JSON.stringify(state.categories));
            saveStoredData('finflow_goals', JSON.stringify(state.goals));
            renderAll();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderAll();
        }

        function renderAll() {
            updateMonthLabel();
            renderDashboard();
            renderTransactions();
            renderFixedExpenses();
            renderBudgets();
            renderGoals();
            renderCategoryOptions();
        }

        function updateMonthLabel() {
            const m = monthNames[currentDate.getMonth()];
            const y = currentDate.getFullYear();
            document.getElementById('currentMonthLabel').innerText = `${m} ${y}`;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => el.className = 'nav-item flex-1 flex flex-col items-center py-1 text-gray-400');
            document.getElementById(`nav-${tabId}`).className = 'nav-item flex-1 flex flex-col items-center py-1 text-brand-600 dark:text-brand-400';
        }

        function openModal(id) {
            document.getElementById('backdrop').classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function closeAllModals() {
            document.getElementById('backdrop').classList.remove('active');
            document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('active'));
        }

        function setTxType(type) {
            state.currentTxType = type;
            const expenseBtn = document.getElementById('typeExpenseBtn');
            const incomeBtn = document.getElementById('typeIncomeBtn');

            if (type === 'expense') {
                expenseBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-600 shadow-sm text-rose-600';
                incomeBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-500';
            } else {
                incomeBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-600 shadow-sm text-emerald-600';
                expenseBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-500';
            }
        }

        function openTxModal(tx = null) {
            if (tx) {
                document.getElementById('txId').value = tx.id;
                document.getElementById('txDesc').value = tx.desc;
                document.getElementById('txAmount').value = tx.amount;
                document.getElementById('txCategory').value = tx.category;
                document.getElementById('txPaymentMethod').value = tx.paymentMethod || 'Pix';
                document.getElementById('txDate').value = tx.date;
                document.getElementById('txModalTitle').innerText = 'Editar Transação';
                setTxType(tx.type);
            } else {
                document.getElementById('txForm').reset();
                document.getElementById('txId').value = '';
                document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('txModalTitle').innerText = 'Nova Transação';
                setTxType('expense');
            }
            openModal('txModal');
        }

        function saveTransaction(e) {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const newTx = {
                id: id || Date.now().toString(),
                desc: document.getElementById('txDesc').value,
                amount: parseFloat(document.getElementById('txAmount').value),
                category: document.getElementById('txCategory').value,
                paymentMethod: document.getElementById('txPaymentMethod').value,
                type: state.currentTxType,
                date: document.getElementById('txDate').value
            };

            if (id) {
                const idx = state.transactions.findIndex(t => t.id === id);
                if (idx !== -1) state.transactions[idx] = newTx;
            } else {
                state.transactions.unshift(newTx);
            }

            saveData();
            closeAllModals();
        }

        function deleteTx(id) {
            if (confirm('Deseja excluir esta transação?')) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveData();
            }
        }

        function getFilteredTransactionsForCurrentMonth() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            return state.transactions.filter(t => {
                const tDate = new Date(t.date + 'T00:00:00');
                return tDate.getFullYear() === year && tDate.getMonth() === month;
            });
        }

        function renderDashboard() {
            const monthTxs = getFilteredTransactionsForCurrentMonth();
            const income = monthTxs.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expense = monthTxs.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const balance = income - expense;

            document.getElementById('dashIncome').innerText = `R$ ${income.toFixed(2)}`;
            document.getElementById('dashExpense').innerText = `R$ ${expense.toFixed(2)}`;
            document.getElementById('dashBalance').innerText = `R$ ${balance.toFixed(2)}`;

            const recent = monthTxs.slice(0, 4);
            const recentList = document.getElementById('dashRecentList');
            recentList.innerHTML = recent.map(t => `
                <div class="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-700 last:border-none">
                    <div>
                        <p class="text-xs font-semibold">${t.desc}</p>
                        <span class="text-[10px] text-gray-400">${t.category} • ${t.paymentMethod || 'Pix'}</span>
                    </div>
                    <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                        ${t.type === 'income' ? '+' : '-'} R$ ${t.amount.toFixed(2)}
                    </span>
                </div>
            `).join('') || '<p class="text-xs text-gray-400">Nenhuma transação neste mês.</p>';

            updateChart(monthTxs);
        }

        function renderTransactions() {
            const monthTxs = getFilteredTransactionsForCurrentMonth();
            const search = document.getElementById('txSearch').value.toLowerCase();
            const type = document.getElementById('txTypeFilter').value;
            const cat = document.getElementById('txCatFilter').value;

            const filtered = monthTxs.filter(t => {
                const matchesSearch = t.desc.toLowerCase().includes(search);
                const matchesType = type === 'all' || t.type === type;
                const matchesCat = cat === 'all' || t.category === cat;
                return matchesSearch && matchesType && matchesCat;
            });

            const list = document.getElementById('fullTxList');
            list.innerHTML = filtered.map(t => `
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold">${t.desc}</p>
                        <p class="text-[10px] text-gray-400">${t.category} • ${t.paymentMethod || 'Pix'} • ${t.date}</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                            ${t.type === 'income' ? '+' : '-'} R$ ${t.amount.toFixed(2)}
                        </span>
                        <button onclick="openTxModal(${JSON.stringify(t).replace(/"/g, '&quot;')})" class="text-gray-400 hover:text-brand-500 text-xs">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteTx('${t.id}')" class="text-gray-300 hover:text-rose-500 text-xs">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-gray-400 text-center py-4">Nenhuma transação encontrada no mês.</p>';
        }

        function renderFixedExpenses() {
            const list = document.getElementById('fixedList');
            const currentMonthTxs = getFilteredTransactionsForCurrentMonth();

            list.innerHTML = state.fixedExpenses.map(f => {
                const isPaid = currentMonthTxs.some(t => t.desc.includes(f.desc) && t.type === 'expense');

                return `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex justify-between items-center">
                        <div>
                            <p class="text-xs font-bold">${f.desc}</p>
                            <p class="text-[10px] text-gray-400">Vence dia ${f.day} • ${f.category} • ${f.paymentMethod}</p>
                            <span class="text-xs font-bold text-gray-800 dark:text-gray-100 mt-1 block">R$ ${f.amount.toFixed(2)}</span>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            ${isPaid 
                                ? `<span class="text-[10px] bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 font-bold px-2.5 py-1 rounded-lg"><i class="fas fa-check mr-1"></i>Pago</span>`
                                : `<button onclick="confirmFixedPayment('${f.id}')" class="text-xs bg-brand-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-sm active:scale-95 transition-transform">Confirmar</button>`
                            }
                            <div class="flex items-center gap-2">
                                <button onclick="openFixedModal(${JSON.stringify(f).replace(/"/g, '&quot;')})" class="text-gray-400 hover:text-brand-500 text-[10px]"><i class="fas fa-edit mr-0.5"></i>Editar</button>
                                <button onclick="deleteFixed('${f.id}')" class="text-gray-300 hover:text-rose-500 text-[10px]"><i class="fas fa-trash mr-0.5"></i>Remover</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-xs text-gray-400 text-center py-4">Nenhuma despesa fixa cadastrada.</p>';
        }

        function openFixedModal(fixed = null) {
            if (fixed) {
                document.getElementById('fixedId').value = fixed.id;
                document.getElementById('fixedDesc').value = fixed.desc;
                document.getElementById('fixedAmount').value = fixed.amount;
                document.getElementById('fixedDay').value = fixed.day;
                document.getElementById('fixedCategory').value = fixed.category;
                document.getElementById('fixedPaymentMethod').value = fixed.paymentMethod || 'Pix';
                document.getElementById('fixedModalTitle').innerText = 'Editar Despesa Fixa';
            } else {
                document.getElementById('fixedForm').reset();
                document.getElementById('fixedId').value = '';
                document.getElementById('fixedModalTitle').innerText = 'Nova Despesa Fixa';
            }
            openModal('fixedModal');
        }

        function saveFixed(e) {
            e.preventDefault();
            const id = document.getElementById('fixedId').value;
            const fixedData = {
                id: id || Date.now().toString(),
                desc: document.getElementById('fixedDesc').value,
                amount: parseFloat(document.getElementById('fixedAmount').value),
                day: parseInt(document.getElementById('fixedDay').value),
                category: document.getElementById('fixedCategory').value,
                paymentMethod: document.getElementById('fixedPaymentMethod').value
            };

            if (id) {
                const idx = state.fixedExpenses.findIndex(f => f.id === id);
                if (idx !== -1) state.fixedExpenses[idx] = fixedData;
            } else {
                state.fixedExpenses.push(fixedData);
            }

            saveData();
            closeAllModals();
        }

        function deleteFixed(id) {
            if (confirm('Excluir esta despesa fixa?')) {
                state.fixedExpenses = state.fixedExpenses.filter(f => f.id !== id);
                saveData();
            }
        }

        function confirmFixedPayment(id) {
            const fixed = state.fixedExpenses.find(f => f.id === id);
            if (!fixed) return;

            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const day = String(fixed.day).padStart(2, '0');

            const paidTx = {
                id: Date.now().toString(),
                type: 'expense',
                desc: `[Fixa] ${fixed.desc}`,
                amount: fixed.amount,
                category: fixed.category,
                paymentMethod: fixed.paymentMethod,
                date: `${year}-${month}-${day}`
            };

            state.transactions.unshift(paidTx);
            saveData();
        }

        function openReportModal() {
            openModal('reportModal');
            renderAnnualReport();
        }

        function renderAnnualReport() {
            const currentYear = currentDate.getFullYear();
            const monthlyData = [];

            for (let m = 0; m < 12; m++) {
                const txs = state.transactions.filter(t => {
                    const d = new Date(t.date + 'T00:00:00');
                    return d.getFullYear() === currentYear && d.getMonth() === m;
                });

                const inc = txs.filter(t => t.type === 'income').reduce((a, t) => a + t.amount, 0);
                const exp = txs.filter(t => t.type === 'expense').reduce((a, t) => a + t.amount, 0);

                monthlyData.push({ month: monthNames[m], income: inc, expense: exp });
            }

            const list = document.getElementById('annualReportList');
            list.innerHTML = monthlyData.map(d => `
                <div class="flex justify-between items-center py-2 px-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700 text-xs">
                    <span class="font-bold w-20">${d.month}</span>
                    <span class="text-emerald-500 font-semibold">+R$ ${d.income.toFixed(0)}</span>
                    <span class="text-rose-500 font-semibold">-R$ ${d.expense.toFixed(0)}</span>
                    <span class="font-bold ${d.income - d.expense >= 0 ? 'text-gray-800 dark:text-white' : 'text-rose-600'}">R$ ${(d.income - d.expense).toFixed(0)}</span>
                </div>
            `).join('');

            const ctx = document.getElementById('annualComparisonChart').getContext('2d');
            if (state.annualChart) state.annualChart.destroy();

            state.annualChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: monthNames.map(m => m.substring(0, 3)),
                    datasets: [
                        { label: 'Receitas', data: monthlyData.map(d => d.income), backgroundColor: '#10b981' },
                        { label: 'Despesas', data: monthlyData.map(d => d.expense), backgroundColor: '#f43f5e' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { font: { size: 10 } } } }
                }
            });
        }

        function renderBudgets() {
            const list = document.getElementById('budgetList');
            const monthTxs = getFilteredTransactionsForCurrentMonth();

            list.innerHTML = state.categories.map(cat => {
                const spent = monthTxs
                    .filter(t => t.category === cat.name && t.type === 'expense')
                    .reduce((acc, t) => acc + t.amount, 0);
                const limit = cat.limit || 0;
                const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
                const isOver = limit > 0 && spent > limit;

                return `
                    <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full" style="background:${cat.color}"></span>
                                ${cat.name}
                            </span>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] ${isOver ? 'text-rose-600 font-bold' : 'text-gray-400'}">
                                    R$ ${spent.toFixed(0)} ${limit > 0 ? `/ R$ ${limit}` : '(sem limite)'}
                                </span>
                                <button onclick="openCategoryModal(${JSON.stringify(cat).replace(/"/g, '&quot;')})" class="text-gray-400 hover:text-brand-500 text-xs ml-1">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteCategory('${cat.id}')" class="text-gray-300 hover:text-rose-500 text-xs">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        ${limit > 0 ? `
                        <div class="w-full bg-gray-100 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
                            <div class="h-full rounded-full ${isOver ? 'bg-rose-500' : 'bg-brand-600'}" style="width: ${pct}%"></div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('') || '<p class="text-xs text-gray-400 text-center py-4">Nenhuma categoria cadastrada.</p>';
        }

        function openCategoryModal(cat = null) {
            if (cat) {
                document.getElementById('catId').value = cat.id;
                document.getElementById('catName').value = cat.name;
                document.getElementById('catColor').value = cat.color || '#6366f1';
                document.getElementById('catLimit').value = cat.limit || '';
                document.getElementById('categoryModalTitle').innerText = 'Editar Categoria / Limite';
            } else {
                document.getElementById('categoryForm').reset();
                document.getElementById('catId').value = '';
                document.getElementById('catColor').value = '#6366f1';
                document.getElementById('categoryModalTitle').innerText = 'Nova Categoria e Limite';
            }
            openModal('categoryModal');
        }

        function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('catId').value;
            const name = document.getElementById('catName').value;
            const color = document.getElementById('catColor').value;
            const limit = parseFloat(document.getElementById('catLimit').value) || 0;

            if (id) {
                const cat = state.categories.find(c => c.id === id);
                if (cat) {
                    const oldName = cat.name;
                    cat.name = name;
                    cat.color = color;
                    cat.limit = limit;

                    if (oldName !== name) {
                        state.transactions.forEach(t => { if (t.category === oldName) t.category = name; });
                        state.fixedExpenses.forEach(f => { if (f.category === oldName) f.category = name; });
                    }
                }
            } else {
                state.categories.push({ id: Date.now().toString(), name, color, limit });
            }

            saveData();
            closeAllModals();
        }

        function deleteCategory(id) {
            if (confirm('Excluir esta categoria?')) {
                state.categories = state.categories.filter(c => c.id !== id);
                saveData();
            }
        }

        function renderCategoryOptions() {
            const selects = [document.getElementById('txCategory'), document.getElementById('txCatFilter'), document.getElementById('fixedCategory')];
            selects.forEach(sel => {
                if (!sel) return;
                const isFilter = sel.id === 'txCatFilter';
                sel.innerHTML = isFilter ? '<option value="all">Todas categorias</option>' : '';
                state.categories.forEach(c => {
                    sel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
                });
            });
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = state.goals.map(g => {
                const pct = Math.min(100, Math.round((g.current / g.target) * 100));
                return `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold">${g.title}</h4>
                            <div class="flex items-center gap-2">
                                <button onclick="depositGoal('${g.id}')" class="text-[10px] bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 font-bold px-2 py-0.5 rounded-lg active:scale-95 transition-transform">+ Aporte</button>
                                <button onclick="openGoalModal(${JSON.stringify(g).replace(/"/g, '&quot;')})" class="text-gray-400 hover:text-brand-500 text-xs"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteGoal('${g.id}')" class="text-gray-300 hover:text-rose-500 text-xs"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>R$ ${g.current.toFixed(2)} acumulados (${pct}%)</span>
                            <span>Meta: R$ ${g.target.toFixed(2)}</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500 rounded-full" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('') || '<p class="text-xs text-gray-400 text-center py-4">Nenhuma meta cadastrada.</p>';
        }

        function depositGoal(id) {
            const val = prompt('Qual o valor do aporte para esta meta (R$)?');
            const amount = parseFloat(val);
            if (!isNaN(amount) && amount > 0) {
                const goal = state.goals.find(g => g.id === id);
                if (goal) {
                    goal.current += amount;
                    saveData();
                }
            }
        }

        function openGoalModal(goal = null) {
            if (goal) {
                document.getElementById('goalId').value = goal.id;
                document.getElementById('goalTitle').value = goal.title;
                document.getElementById('goalTarget').value = goal.target;
                document.getElementById('goalCurrent').value = goal.current;
                document.getElementById('goalDeadline').value = goal.deadline;
                document.getElementById('goalModalTitle').innerText = 'Editar Meta';
            } else {
                document.getElementById('goalForm').reset();
                document.getElementById('goalId').value = '';
                document.getElementById('goalModalTitle').innerText = 'Nova Meta';
            }
            openModal('goalModal');
        }

        function saveGoal(e) {
            e.preventDefault();
            const id = document.getElementById('goalId').value;
            const goalData = {
                id: id || Date.now().toString(),
                title: document.getElementById('goalTitle').value,
                target: parseFloat(document.getElementById('goalTarget').value),
                current: parseFloat(document.getElementById('goalCurrent').value),
                deadline: document.getElementById('goalDeadline').value
            };

            if (id) {
                const idx = state.goals.findIndex(g => g.id === id);
                if (idx !== -1) state.goals[idx] = goalData;
            } else {
                state.goals.push(goalData);
            }

            saveData();
            closeAllModals();
        }

        function deleteGoal(id) {
            if (confirm('Excluir esta meta?')) {
                state.goals = state.goals.filter(g => g.id !== id);
                saveData();
            }
        }

        function initChart() {
            const ctx = document.getElementById('categoryChartMobile').getContext('2d');
            state.chart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        function updateChart(monthTxs) {
            if (!state.chart) return;
            const expenses = monthTxs.filter(t => t.type === 'expense');
            const dataMap = {};

            expenses.forEach(t => {
                dataMap[t.category] = (dataMap[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(dataMap);
            const data = Object.values(dataMap);
            const colors = labels.map(l => {
                const cat = state.categories.find(c => c.name === l);
                return cat ? cat.color : '#6366f1';
            });

            state.chart.data.labels = labels;
            state.chart.data.datasets[0].data = data;
            state.chart.data.datasets[0].backgroundColor = colors;
            state.chart.update();
        }

        function initDarkModeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun text-xs' : 'fas fa-moon text-xs';
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun text-xs' : 'fas fa-moon text-xs';
            saveStoredData('finflow_theme', isDark ? 'dark' : 'light');
        }
    </script>
