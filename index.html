<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJ-MyFinance</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome / Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between">

  <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
  <div id="auth-screen" class="flex items-center justify-center min-h-screen bg-slate-900 px-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 space-y-6">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">AJ-MyFinance</h1>
        <p class="text-sm text-slate-500 mt-1">Gerencie suas finanças com facilidade</p>
      </div>

      <!-- Formulário Email e Senha -->
      <form id="email-login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="auth-email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input type="password" id="auth-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" id="btn-login-email" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition">
            Entrar
          </button>
          <button type="button" id="btn-signup-email" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 px-4 rounded-lg transition">
            Cadastrar
          </button>
        </div>
      </form>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-300"></div>
        <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase font-bold">ou</span>
        <div class="flex-grow border-t border-slate-300"></div>
      </div>

      <!-- Botão Login com Google -->
      <button id="btn-google-login" type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-lg shadow-sm transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Entrar com o Google
      </button>

      <p id="auth-error" class="text-xs text-red-500 text-center hidden"></p>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL DO APLICATIVO -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col">
    <!-- Cabeçalho -->
    <header class="bg-slate-900 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <img id="user-photo" src="https://via.placeholder.com/40" alt="Foto do Usuário" class="w-10 h-10 rounded-full border-2 border-indigo-500 object-cover">
          <div>
            <h2 class="font-bold text-lg leading-tight" id="user-display-name">Bem-vindo(a)!</h2>
            <p class="text-xs text-slate-400">AJ-MyFinance Dashboard</p>
          </div>
        </div>
        <button id="btn-logout" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow space-y-6">
      
      <!-- Cards Resumo das Finanças -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-sm font-medium text-slate-500">Receitas</p>
          <p id="total-income" class="text-2xl font-bold text-emerald-600 mt-1">R$ 0,00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-sm font-medium text-slate-500">Despesas</p>
          <p id="total-expense" class="text-2xl font-bold text-rose-600 mt-1">R$ 0,00</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <p class="text-sm font-medium text-slate-500">Saldo Total</p>
          <p id="total-balance" class="text-2xl font-bold text-slate-800 mt-1">R$ 0,00</p>
        </div>
      </div>

      <!-- Formulário de Adicionar e Editar Transação -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3 id="form-title" class="text-lg font-bold text-slate-800 mb-4">Adicionar Transação</h3>
        <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <input type="hidden" id="transaction-id">
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Descrição</label>
            <input type="text" id="tx-description" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex: Salário, Aluguel">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="tx-amount" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0,00">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipo</label>
            <select id="tx-type" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="income">Receita (+)</option>
              <option value="expense">Despesa (-)</option>
            </select>
          </div>

          <div class="flex items-end gap-2">
            <button type="submit" id="btn-save-tx" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg transition">
              Salvar
            </button>
            <button type="button" id="btn-cancel-edit" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg transition">
              Cancelar
            </button>
          </div>
        </form>
      </div>

      <!-- Tabela de Transações (com Editar/Excluir) -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
          <h3 class="font-bold text-slate-800">Transações Recentes</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                <th class="py-3 px-6">Descrição</th>
                <th class="py-3 px-6">Tipo</th>
                <th class="py-3 px-6">Valor</th>
                <th class="py-3 px-6 text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="transactions-list" class="divide-y divide-slate-100 text-sm">
              <!-- As transações serão inseridas aqui via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      serverTimestamp,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração do Firebase para o projeto aj-connectpb
    const firebaseConfig = {
      apiKey: "AIzaSyD-YOUR_KEY",
      authDomain: "aj-connectpb.firebaseapp.com",
      projectId: "aj-connectpb",
      storageBucket: "aj-connectpb.appspot.com",
      messagingSenderId: "951911364500",
      appId: "1:951911364500:web:YOUR_APP_ID"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Mapeamento de Elementos da Tela
    const authScreen = document.getElementById("auth-screen");
    const appScreen = document.getElementById("app-screen");
    const authError = document.getElementById("auth-error");

    const emailInput = document.getElementById("auth-email");
    const passwordInput = document.getElementById("auth-password");
    const btnSignupEmail = document.getElementById("btn-signup-email");
    const btnGoogleLogin = document.getElementById("btn-google-login");
    const btnLogout = document.getElementById("btn-logout");

    const userDisplayName = document.getElementById("user-display-name");
    const userPhoto = document.getElementById("user-photo");

    const txForm = document.getElementById("transaction-form");
    const txIdInput = document.getElementById("transaction-id");
    const txDescInput = document.getElementById("tx-description");
    const txAmountInput = document.getElementById("tx-amount");
    const txTypeSelect = document.getElementById("tx-type");
    const formTitle = document.getElementById("form-title");
    const btnCancelEdit = document.getElementById("btn-cancel-edit");

    const totalIncomeEl = document.getElementById("total-income");
    const totalExpenseEl = document.getElementById("total-expense");
    const totalBalanceEl = document.getElementById("total-balance");
    const transactionsList = document.getElementById("transactions-list");

    let currentUser = null;
    let unsubscribeFirestore = null;
    let localTransactions = [];

    // Transações padrão de exemplo para o primeiro acesso
    const defaultTransactions = [
      { description: "Salário Mensal", amount: 5000.00, type: "income" },
      { description: "Supermercado", amount: 450.00, type: "expense" },
      { description: "Conta de Luz", amount: 180.50, type: "expense" }
    ];

    // --- AUTENTICAÇÃO ---

    // Login Google
    btnGoogleLogin.addEventListener("click", async () => {
      try {
        hideError();
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showError("Erro ao entrar com Google: " + err.message);
      }
    });

    // Login Email/Senha
    document.getElementById("email-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        hideError();
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (err) {
        showError("Erro de autenticação. Verifique e-mail e senha.");
      }
    });

    // Cadastro Email/Senha
    btnSignupEmail.addEventListener("click", async () => {
      if (!emailInput.value || !passwordInput.value) {
        showError("Informe e-mail e senha para realizar o cadastro.");
        return;
      }
      try {
        hideError();
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (err) {
        showError("Erro ao cadastrar: " + err.message);
      }
    });

    // Logout
    btnLogout.addEventListener("click", () => {
      if (unsubscribeFirestore) unsubscribeFirestore();
      signOut(auth);
    });

    // Monitor do estado do usuário
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");

        const name = user.displayName || user.email.split('@')[0];
        userDisplayName.textContent = `Olá, ${name}! 👋`;
        userPhoto.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff`;

        setupFirestoreListener(user.uid);
      } else {
        currentUser = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        appScreen.classList.add("hidden");
        authScreen.classList.remove("hidden");
      }
    });

    // --- BANCO DE DADOS (FIRESTORE) ---

    async function setupFirestoreListener(userId) {
      const userDocRef = collection(db, "users", userId, "transactions");

      const snapshot = await getDocs(userDocRef);
      if (snapshot.empty) {
        for (const tx of defaultTransactions) {
          await addDoc(userDocRef, { ...tx, createdAt: serverTimestamp() });
        }
      }

      unsubscribeFirestore = onSnapshot(userDocRef, (querySnapshot) => {
        localTransactions = [];
        querySnapshot.forEach((doc) => {
          localTransactions.push({ id: doc.id, ...doc.data() });
        });
        renderApp();
      });
    }

    // Criar/Editar Transação
    txForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const txId = txIdInput.value;
      const data = {
        description: txDescInput.value,
        amount: parseFloat(txAmountInput.value),
        type: txTypeSelect.value
      };

      const userDocRef = collection(db, "users", currentUser.uid, "transactions");

      if (txId) {
        await updateDoc(doc(db, "users", currentUser.uid, "transactions", txId), data);
      } else {
        await addDoc(userDocRef, { ...data, createdAt: serverTimestamp() });
      }

      resetForm();
    });

    // Função de Editar
    window.editTransaction = function(id) {
      const tx = localTransactions.find(t => t.id === id);
      if (!tx) return;

      txIdInput.value = tx.id;
      txDescInput.value = tx.description;
      txAmountInput.value = tx.amount;
      txTypeSelect.value = tx.type;

      formTitle.textContent = "Editar Transação";
      btnCancelEdit.classList.remove("hidden");
    };

    btnCancelEdit.addEventListener("click", resetForm);

    function resetForm() {
      txForm.reset();
      txIdInput.value = "";
      formTitle.textContent = "Adicionar Transação";
      btnCancelEdit.classList.add("hidden");
    }

    // Função de Excluir
    window.deleteTransaction = async function(id) {
      if (confirm("Deseja apagar esta transação?")) {
        await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id));
      }
    };

    // Renderização dos Dados na Tela
    function renderApp() {
      let income = 0;
      let expense = 0;

      transactionsList.innerHTML = "";

      if (localTransactions.length === 0) {
        transactionsList.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">Nenhuma transação encontrada.</td></tr>`;
      }

      localTransactions.forEach((tx) => {
        if (tx.type === "income") income += tx.amount;
        if (tx.type === "expense") expense += tx.amount;

        const row = document.createElement("tr");
        row.className = "hover:bg-slate-50 transition";
        row.innerHTML = `
          <td class="py-3 px-6 font-medium text-slate-800">${tx.description}</td>
          <td class="py-3 px-6">
            <span class="px-2 py-1 text-xs rounded-full font-semibold ${tx.type === 'income' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
              ${tx.type === 'income' ? 'Receita' : 'Despesa'}
            </span>
          </td>
          <td class="py-3 px-6 font-semibold ${tx.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
            ${tx.type === 'income' ? '+' : '-'} R$ ${tx.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
          </td>
          <td class="py-3 px-6 text-right space-x-2">
            <button onclick="editTransaction('${tx.id}')" class="text-indigo-600 hover:text-indigo-800 p-1">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteTransaction('${tx.id}')" class="text-rose-600 hover:text-rose-800 p-1">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        transactionsList.appendChild(row);
      });

      const balance = income - expense;
      totalIncomeEl.textContent = `R$ ${income.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
      totalExpenseEl.textContent = `R$ ${expense.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
      totalBalanceEl.textContent = `R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
    }

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove("hidden");
    }

    function hideError() {
      authError.classList.add("hidden");
    }
  </script>
</body>
</html>
