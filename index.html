<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ-MyFinance - AJ Connect</title>
    <!-- Tailwind CSS para o visual -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 text-center">
            <div class="mb-6">
                <span class="text-xs font-bold tracking-wider text-indigo-600 uppercase bg-indigo-50 px-3 py-1 rounded-full">Plataforma AJ Connect</span>
                <h1 class="text-3xl font-extrabold text-gray-900 mt-2"><i class="fa-solid fa-wallet text-indigo-600 mr-2"></i>AJ-MyFinance</h1>
                <p class="text-sm text-gray-500 mt-1">Gerencie suas finanças na nuvem</p>
            </div>

            <div id="auth-error" class="hidden bg-red-100 text-red-700 p-3 rounded-lg text-sm mb-4"></div>

            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Seu E-mail" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                <input type="password" id="auth-password" placeholder="Sua Senha" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                
                <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg transition duration-200 shadow-md">
                    Entrar / Cadastrar
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">Ou</span></div>
            </div>

            <button id="btn-google" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold p-3 rounded-lg hover:bg-gray-50 transition duration-200 flex items-center justify-center gap-2 shadow-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                Entrar com Google
            </button>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL DO APP -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- BARRA SUPERIOR (HEADER) -->
        <header class="bg-indigo-600 text-white p-4 shadow-md">
            <div class="max-w-5xl mx-auto flex justify-between items-center flex-wrap gap-4">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-chart-line text-2xl"></i>
                    <div>
                        <h1 class="text-xl font-bold leading-tight">AJ-MyFinance</h1>
                        <p class="text-xs text-indigo-200">Conectado via AJ Connect</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- BOTÕES DE BACKUP (EXPORTAR E IMPORTAR) -->
                    <button id="btn-export" title="Exportar Backup (JSON)" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Exportar</span>
                    </button>
                    
                    <label id="btn-import-label" title="Importar Backup (JSON)" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-upload"></i> <span class="hidden sm:inline">Importar</span>
                        <input type="file" id="btn-import" accept=".json" class="hidden">
                    </label>

                    <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 ml-2">
                        <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Sair</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="max-w-5xl mx-auto w-full p-4 flex-grow space-y-6">
            
            <!-- CARDS DE RESUMO FINANCEIRO -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase font-semibold">Receitas</p>
                        <p id="total-income" class="text-2xl font-bold text-green-600">R$ 0,00</p>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full text-green-600"><i class="fa-solid fa-arrow-up text-xl"></i></div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase font-semibold">Despesas</p>
                        <p id="total-expense" class="text-2xl font-bold text-red-600">R$ 0,00</p>
                    </div>
                    <div class="bg-red-100 p-3 rounded-full text-red-600"><i class="fa-solid fa-arrow-down text-xl"></i></div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase font-semibold">Saldo Atual</p>
                        <p id="total-balance" class="text-2xl font-bold text-indigo-600">R$ 0,00</p>
                    </div>
                    <div class="bg-indigo-100 p-3 rounded-full text-indigo-600"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
                </div>
            </div>

            <!-- FORMULÁRIO DE CADASTRO DE REGISTROS -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Novo Lançamento</h2>
                <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="desc" placeholder="Descrição (Ex: Salário, Aluguel)" required class="p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="number" step="0.01" id="amount" placeholder="Valor (R$)" required class="p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <select id="type" class="p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="income">Receita (+)</option>
                        <option value="expense">Despesa (-)</option>
                    </select>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg transition duration-200">
                        <i class="fa-solid fa-plus mr-1"></i> Adicionar
                    </button>
                </form>
            </div>

            <!-- TABELA DE LANÇAMENTOS -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-4 border-b border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800">Histórico de Lançamentos</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs uppercase border-b">
                                <th class="p-4">Descrição</th>
                                <th class="p-4">Tipo</th>
                                <th class="p-4">Valor</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-list" class="divide-y divide-gray-100 text-sm">
                            <!-- Os itens serão inseridos aqui via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MÓDULOS DO FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            deleteDoc, 
            doc, 
            query, 
            where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUA CONFIGURAÇÃO DO FIREBASE (AJ Connect)
        const firebaseConfig = {
            apiKey: "AIzaSyDpXsLsU8kYkf47yv3Pu3dJ32okPtscDKo",
            authDomain: "aj-connect-46fe9.firebaseapp.com",
            projectId: "aj-connect-46fe9",
            storageBucket: "aj-connect-46fe9.firebasestorage.app",
            messagingSenderId: "827475871787",
            appId: "1:827475871787:web:c29e6960054d33fd9d826e"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeSnapshot = null;
        let currentTransactions = [];

        // ELEMENTOS DOM
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authError = document.getElementById('auth-error');
        const btnGoogle = document.getElementById('btn-google');
        const btnLogout = document.getElementById('btn-logout');

        const transactionForm = document.getElementById('transaction-form');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const typeSelect = document.getElementById('type');
        const transactionList = document.getElementById('transaction-list');

        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const totalBalanceEl = document.getElementById('total-balance');

        const btnExport = document.getElementById('btn-export');
        const btnImport = document.getElementById('btn-import');

        // MONITORA ESTADO DA AUTENTICAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                loadTransactions();
            } else {
                currentUser = null;
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                appScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });

        // LOGIN / CADASTRO COM EMAIL E SENHA
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = authEmail.value;
            const password = authPassword.value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (createErr) {
                        showAuthError(createErr.message);
                    }
                } else {
                    showAuthError(err.message);
                }
            }
        });

        // LOGIN COM GOOGLE
        btnGoogle.addEventListener('click', async () => {
            authError.classList.add('hidden');
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                showAuthError(err.message);
            }
        });

        // LOGOUT
        btnLogout.addEventListener('click', () => signOut(auth));

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }

        // CARREGAR TRANSAÇÕES DO FIRESTORE EM TEMPO REAL
        function loadTransactions() {
            const q = query(
                collection(db, "transactions"), 
                where("uid", "==", currentUser.uid)
            );

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                currentTransactions = [];
                transactionList.innerHTML = '';

                let incomeTotal = 0;
                let expenseTotal = 0;

                snapshot.forEach((docSnap) => {
                    const item = { id: docSnap.id, ...docSnap.data() };
                    currentTransactions.push(item);

                    if (item.type === 'income') incomeTotal += Number(item.amount);
                    if (item.type === 'expense') expenseTotal += Number(item.amount);

                    renderRow(item);
                });

                updateTotals(incomeTotal, expenseTotal);
            });
        }

        // ADICIONAR NOVA TRANSAÇÃO
        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const desc = descInput.value;
            const amount = parseFloat(amountInput.value);
            const type = typeSelect.value;

            if (!desc || isNaN(amount)) return;

            try {
                await addDoc(collection(db, "transactions"), {
                    uid: currentUser.uid,
                    desc,
                    amount,
                    type,
                    createdAt: new Date().toISOString()
                });

                descInput.value = '';
                amountInput.value = '';
            } catch (err) {
                alert('Erro ao salvar lançamento: ' + err.message);
            }
        });

        // EXCLUIR TRANSAÇÃO
        window.deleteTransaction = async (id) => {
            if (confirm('Tem certeza que deseja excluir este lançamento?')) {
                try {
                    await deleteDoc(doc(db, "transactions", id));
                } catch (err) {
                    alert('Erro ao excluir: ' + err.message);
                }
            }
        };

        // EXPORTAR DADOS (JSON)
        btnExport.addEventListener('click', () => {
            if (currentTransactions.length === 0) {
                alert('Não há lançamentos para exportar.');
                return;
            }

            const cleanData = currentTransactions.map(({ desc, amount, type, createdAt }) => ({
                desc, amount, type, createdAt
            }));

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `AJ-MyFinance_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // IMPORTAR DADOS (JSON)
        btnImport.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (!Array.isArray(importedData)) throw new Error("Formato inválido.");

                    let count = 0;
                    for (const item of importedData) {
                        if (item.desc && item.amount && item.type) {
                            await addDoc(collection(db, "transactions"), {
                                uid: currentUser.uid,
                                desc: item.desc,
                                amount: Number(item.amount),
                                type: item.type,
                                createdAt: item.createdAt || new Date().toISOString()
                            });
                            count++;
                        }
                    }
                    alert(`${count} lançamentos importados com sucesso!`);
                } catch (err) {
                    alert('Falha ao importar o arquivo. Verifique se é um arquivo JSON válido.');
                }
            };
            reader.readAsText(file);
        });

        // DESENHAR LINHA NA TABELA
        function renderRow(item) {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition";
            
            const isIncome = item.type === 'income';
            const badgeClass = isIncome ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
            const typeText = isIncome ? 'Receita' : 'Despesa';
            const formattedAmount = Number(item.amount).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            tr.innerHTML = `
                <td class="p-4 font-medium text-gray-900">${item.desc}</td>
                <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full font-semibold ${badgeClass}">${typeText}</span></td>
                <td class="p-4 font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">${formattedAmount}</td>
                <td class="p-4 text-center">
                    <button onclick="deleteTransaction('${item.id}')" class="text-gray-400 hover:text-red-600 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            `;
            transactionList.appendChild(tr);
        }

        // ATUALIZAR VALORES TOTAIS
        function updateTotals(income, expense) {
            const balance = income - expense;

            totalIncomeEl.textContent = income.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalExpenseEl.textContent = expense.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            totalBalanceEl.textContent = balance.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            totalBalanceEl.className = `text-2xl font-bold ${balance >= 0 ? 'text-indigo-600' : 'text-red-600'}`;
        }
    </script>
</body>
</html>
