<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FinFlow - Controle Financeiro Mobile</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        
        body {
            padding-bottom: env(safe-area-inset-bottom, 20px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .pb-safe {
            padding-bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
        }

        .pt-safe {
            padding-top: max(1rem, env(safe-area-inset-top, 0px));
        }

        .bottom-sheet {
            transition: transform 0.3s ease-out;
            transform: translateY(100%);
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .backdrop {
            transition: opacity 0.3s ease-out;
            opacity: 0;
            pointer-events: none;
        }

        .backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Cabeçalho Fixo Mobile -->
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-20 pt-safe">
        <div class="px-4 py-3 flex justify-between items-center max-w-lg mx-auto">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md">
                    <i class="fas fa-wallet text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-tight">FinFlow</h1>
                    <p class="text-[10px] text-gray-500 dark:text-gray-400">Controle Pessoal</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 flex items-center justify-center">
                    <i class="fas fa-moon text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 px-4 pt-4 max-w-lg mx-auto w-full pb-safe">
        
        <!-- ABA: DASHBOARD / INÍCIO -->
        <section id="tab-dashboard" class="tab-content space-y-4">
            
            <!-- Cards de Resumo -->
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span class="text-[10px] text-gray-500 uppercase font-semibold block">Receitas</span>
                    <span id="dashIncome" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mt-1 block">R$ 0,00</span>
                </div>
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span class="text-[10px] text-gray-500 uppercase font-semibold block">Despesas</span>
                    <span id="dashExpense" class="text-xs font-bold text-rose-600 dark:text-rose-400 mt-1 block">R$ 0,00</span>
                </div>
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span class="text-[10px] text-gray-500 uppercase font-semibold block">Saldo</span>
                    <span id="dashBalance" class="text-xs font-bold text-gray-900 dark:text-white mt-1 block">R$ 0,00</span>
                </div>
            </div>

            <!-- Gráfico principal de Gastos por Categoria -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">Distribuição de Gastos</h3>
                <div class="relative h-48 flex justify-center items-center">
                    <canvas id="categoryChartMobile"></canvas>
                </div>
            </div>

            <!-- Resumo das Últimas Transações -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Recentes</h3>
                    <button onclick="switchTab('transactions')" class="text-xs text-brand-600 dark:text-brand-400 font-semibold">Ver tudo</button>
                </div>
                <div id="dashRecentList" class="space-y-2">
                    <!-- Gerado Dinamicamente -->
                </div>
            </div>
        </section>

        <!-- ABA: TRANSAÇÕES / EXTRATO -->
        <section id="tab-transactions" class="tab-content space-y-4 hidden">
            <!-- Filtro de Busca -->
            <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
                <input type="text" id="txSearch" oninput="renderTransactions()" placeholder="Buscar transação..." class="w-full bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-brand-500">
                <div class="flex gap-2">
                    <select id="txTypeFilter" onchange="renderTransactions()" class="flex-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-2 py-2 text-xs">
                        <option value="all">Todos os tipos</option>
                        <option value="income">Receitas</option>
                        <option value="expense">Despesas</option>
                    </select>
                    <select id="txCatFilter" onchange="renderTransactions()" class="flex-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-2 py-2 text-xs">
                        <option value="all">Todas categorias</option>
                    </select>
                </div>
            </div>

            <!-- Lista Extrato -->
            <div id="fullTxList" class="space-y-2">
                <!-- Gerado dinamicamente -->
            </div>
        </section>

        <!-- ABA: LIMITES & ORÇAMENTOS -->
        <section id="tab-budgets" class="tab-content space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 dark:text-gray-300">Tetos Orçamentários</h2>
                <button onclick="openModal('categoryModal')" class="text-xs text-brand-600 dark:text-brand-400 font-semibold">Gerenciar Categorias</button>
            </div>
            <div id="budgetList" class="space-y-3">
                <!-- Cards de limite por categoria -->
            </div>
        </section>

        <!-- ABA: METAS & OBJETIVOS -->
        <section id="tab-goals" class="tab-content space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 dark:text-gray-300">Minhas Metas</h2>
                <button onclick="openGoalModal()" class="text-xs bg-brand-600 text-white px-3 py-1.5 rounded-xl font-medium shadow-sm">
                    <i class="fas fa-plus text-[10px] mr-1"></i> Nova Meta
                </button>
            </div>
            <div id="goalsList" class="space-y-3">
                <!-- Cards de Metas -->
            </div>
        </section>

    </main>

    <!-- Botão Flutuante Principal (FAB) -->
    <button onclick="openTxModal()" class="fixed right-5 bottom-20 z-30 w-14 h-14 bg-brand-600 text-white rounded-full shadow-lg flex items-center justify-center text-xl active:scale-95 transition-transform">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Barra de Navegação Inferior (Bottom Bar) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 z-30 px-2 py-2">
        <div class="max-w-lg mx-auto flex justify-around items-center">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item flex flex-col items-center py-1 px-3 text-brand-600 dark:text-brand-400">
                <i class="fas fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Início</span>
            </button>
            <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-item flex flex-col items-center py-1 px-3 text-gray-400">
                <i class="fas fa-list-ul text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Extrato</span>
            </button>
            <div class="w-10"></div>
            <button onclick="switchTab('budgets')" id="nav-budgets" class="nav-item flex flex-col items-center py-1 px-3 text-gray-400">
                <i class="fas fa-sliders-h text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Limites</span>
            </button>
            <button onclick="switchTab('goals')" id="nav-goals" class="nav-item flex flex-col items-center py-1 px-3 text-gray-400">
                <i class="fas fa-bullseye text-lg"></i>
                <span class="text-[10px] font-medium mt-1">Metas</span>
            </button>
        </div>
    </nav>

    <!-- Fundo Escuro para os Modais -->
    <div id="backdrop" onclick="closeAllModals()" class="backdrop fixed inset-0 bg-black/50 z-40"></div>

    <!-- MODAL (BOTTOM SHEET): Nova Transação -->
    <div id="txModal" class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 rounded-t-3xl p-5 z-50 max-w-lg mx-auto max-h-[90vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
        <h3 id="txModalTitle" class="text-base font-bold mb-4">Nova Transação</h3>
        <form id="txForm" onsubmit="saveTransaction(event)" class="space-y-3">
            <input type="hidden" id="txId">
            <div class="flex rounded-xl bg-gray-100 dark:bg-gray-700 p-1">
                <button type="button" id="typeExpenseBtn" onclick="setTxType('expense')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-600 shadow-sm text-rose-600">Despesa</button>
                <button type="button" id="typeIncomeBtn" onclick="setTxType('income')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-500">Receita</button>
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Descrição</label>
                <input type="text" id="txDesc" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Valor (R$)</label>
                <input type="number" step="0.01" id="txAmount" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Categoria</label>
                <select id="txCategory" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs"></select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Data</label>
                <input type="date" id="txDate" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl text-xs shadow-md mt-2">Salvar Transação</button>
        </form>
    </div>

    <!-- MODAL: Gerenciar Categorias -->
    <div id="categoryModal" class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 rounded-t-3xl p-5 z-50 max-w-lg mx-auto max-h-[90vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
        <h3 class="text-base font-bold mb-4">Gerenciar Categorias</h3>
        
        <form onsubmit="addCategory(event)" class="flex gap-2 mb-4">
            <input type="text" id="newCatName" placeholder="Nova Categoria" required class="flex-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            <input type="color" id="newCatColor" value="#6366f1" class="w-10 h-9 p-1 rounded-xl border-none">
            <button type="submit" class="bg-brand-600 text-white px-3 py-2 rounded-xl text-xs font-bold">+</button>
        </form>

        <div id="categoryManageList" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>

    <!-- MODAL: Meta / Objetivo -->
    <div id="goalModal" class="bottom-sheet fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 rounded-t-3xl p-5 z-50 max-w-lg mx-auto max-h-[90vh] overflow-y-auto">
        <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-4"></div>
        <h3 id="goalModalTitle" class="text-base font-bold mb-4">Nova Meta</h3>
        <form id="goalForm" onsubmit="saveGoal(event)" class="space-y-3">
            <input type="hidden" id="goalId">
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Nome da Meta</label>
                <input type="text" id="goalTitle" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase">Meta (R$)</label>
                    <input type="number" step="0.01" id="goalTarget" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase">Atual (R$)</label>
                    <input type="number" step="0.01" id="goalCurrent" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
                </div>
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase">Data Limite</label>
                <input type="date" id="goalDeadline" required class="w-full mt-1 bg-gray-50 dark:bg-gray-700 border-none rounded-xl px-3 py-2 text-xs">
            </div>
            <button type="submit" class="w-full py-3 bg-brand-600 text-white font-bold rounded-xl text-xs shadow-md mt-2">Salvar Meta</button>
        </form>
    </div>

    <!-- LÓGICA DO SISTEMA -->
    <script>
        let state = {
            transactions: JSON.parse(localStorage.getItem('finflow_txs')) || [
                { id: '1', type: 'income', desc: 'Salário', amount: 4500, category: 'Salário', date: new Date().toISOString().split('T')[0] },
                { id: '2', type: 'expense', desc: 'Mercado', amount: 650, category: 'Alimentação', date: new Date().toISOString().split('T')[0] }
            ],
            categories: JSON.parse(localStorage.getItem('finflow_cats')) || [
                { id: 'c1', name: 'Alimentação', color: '#f59e0b', limit: 1000 },
                { id: 'c2', name: 'Moradia', color: '#3b82f6', limit: 1500 },
                { id: 'c3', name: 'Transporte', color: '#8b5cf6', limit: 400 },
                { id: 'c4', name: 'Lazer', color: '#ec4899', limit: 300 },
                { id: 'c5', name: 'Salário', color: '#10b981', limit: 0 }
            ],
            goals: JSON.parse(localStorage.getItem('finflow_goals')) || [
                { id: 'g1', title: 'Reserva de Emergência', target: 10000, current: 3500, deadline: '2026-12-31' }
            ],
            currentTxType: 'expense',
            chart: null
        };

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            renderAll();
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        });

        function saveData() {
            localStorage.setItem('finflow_txs', JSON.stringify(state.transactions));
            localStorage.setItem('finflow_cats', JSON.stringify(state.categories));
            localStorage.setItem('finflow_goals', JSON.stringify(state.goals));
            renderAll();
        }

        function renderAll() {
            renderDashboard();
            renderTransactions();
            renderBudgets();
            renderGoals();
            renderCategoryOptions();
            renderCategoryManageList();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.nav-item').forEach(el => el.className = 'nav-item flex flex-col items-center py-1 px-3 text-gray-400');
            document.getElementById(`nav-${tabId}`).className = 'nav-item flex flex-col items-center py-1 px-3 text-brand-600 dark:text-brand-400';
        }

        function openModal(id) {
            document.getElementById('backdrop').classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function closeAllModals() {
            document.getElementById('backdrop').classList.remove('active');
            document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('active'));
        }

        function setTxType(type) {
            state.currentTxType = type;
            const expenseBtn = document.getElementById('typeExpenseBtn');
            const incomeBtn = document.getElementById('typeIncomeBtn');

            if (type === 'expense') {
                expenseBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-600 shadow-sm text-rose-600';
                incomeBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-500';
            } else {
                incomeBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white dark:bg-gray-600 shadow-sm text-emerald-600';
                expenseBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-500';
            }
        }

        function openTxModal(tx = null) {
            if (tx) {
                document.getElementById('txId').value = tx.id;
                document.getElementById('txDesc').value = tx.desc;
                document.getElementById('txAmount').value = tx.amount;
                document.getElementById('txCategory').value = tx.category;
                document.getElementById('txDate').value = tx.date;
                setTxType(tx.type);
            } else {
                document.getElementById('txForm').reset();
                document.getElementById('txId').value = '';
                document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
                setTxType('expense');
            }
            openModal('txModal');
        }

        function saveTransaction(e) {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const newTx = {
                id: id || Date.now().toString(),
                desc: document.getElementById('txDesc').value,
                amount: parseFloat(document.getElementById('txAmount').value),
                category: document.getElementById('txCategory').value,
                type: state.currentTxType,
                date: document.getElementById('txDate').value
            };

            if (id) {
                const idx = state.transactions.findIndex(t => t.id === id);
                state.transactions[idx] = newTx;
            } else {
                state.transactions.unshift(newTx);
            }

            saveData();
            closeAllModals();
        }

        function deleteTx(id) {
            if (confirm('Deseja excluir esta transação?')) {
                state.transactions = state.transactions.filter(t => t.id !== id);
                saveData();
            }
        }

        function renderDashboard() {
            const income = state.transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expense = state.transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const balance = income - expense;

            document.getElementById('dashIncome').innerText = `R$ ${income.toFixed(2)}`;
            document.getElementById('dashExpense').innerText = `R$ ${expense.toFixed(2)}`;
            document.getElementById('dashBalance').innerText = `R$ ${balance.toFixed(2)}`;

            const recent = state.transactions.slice(0, 4);
            const recentList = document.getElementById('dashRecentList');
            recentList.innerHTML = recent.map(t => `
                <div class="flex justify-between items-center py-2 border-b border-gray-100 dark:border-gray-700 last:border-none">
                    <div>
                        <p class="text-xs font-semibold">${t.desc}</p>
                        <span class="text-[10px] text-gray-400">${t.category}</span>
                    </div>
                    <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                        ${t.type === 'income' ? '+' : '-'} R$ ${t.amount.toFixed(2)}
                    </span>
                </div>
            `).join('') || '<p class="text-xs text-gray-400">Nenhuma transação registrada.</p>';

            updateChart();
        }

        function renderTransactions() {
            const search = document.getElementById('txSearch').value.toLowerCase();
            const type = document.getElementById('txTypeFilter').value;
            const cat = document.getElementById('txCatFilter').value;

            const filtered = state.transactions.filter(t => {
                const matchesSearch = t.desc.toLowerCase().includes(search);
                const matchesType = type === 'all' || t.type === type;
                const matchesCat = cat === 'all' || t.category === cat;
                return matchesSearch && matchesType && matchesCat;
            });

            const list = document.getElementById('fullTxList');
            list.innerHTML = filtered.map(t => `
                <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="text-xs font-bold">${t.desc}</p>
                        <p class="text-[10px] text-gray-400">${t.category} • ${t.date}</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                            ${t.type === 'income' ? '+' : '-'} R$ ${t.amount.toFixed(2)}
                        </span>
                        <button onclick="deleteTx('${t.id}')" class="text-gray-300 hover:text-rose-500 text-xs">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-gray-400 text-center py-4">Nenhuma transação encontrada.</p>';
        }

        function renderBudgets() {
            const list = document.getElementById('budgetList');
            const expenseCats = state.categories.filter(c => c.limit > 0);

            list.innerHTML = expenseCats.map(cat => {
                const spent = state.transactions
                    .filter(t => t.category === cat.name && t.type === 'expense')
                    .reduce((acc, t) => acc + t.amount, 0);
                const pct = Math.min(100, Math.round((spent / cat.limit) * 100));

                return `
                    <div class="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full" style="background:${cat.color}"></span>
                                ${cat.name}
                            </span>
                            <span class="text-[10px] text-gray-400">R$ ${spent.toFixed(0)} / R$ ${cat.limit}</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
                            <div class="h-full rounded-full ${pct >= 100 ? 'bg-rose-500' : 'bg-brand-600'}" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = state.goals.map(g => {
                const pct = Math.min(100, Math.round((g.current / g.target) * 100));
                return `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold">${g.title}</h4>
                            <button onclick="deleteGoal('${g.id}')" class="text-gray-300 hover:text-rose-500 text-xs"><i class="fas fa-trash"></i></button>
                        </div>
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>R$ ${g.current.toFixed(2)} acumulados</span>
                            <span>Meta: R$ ${g.target.toFixed(2)}</span>
                        </div>
                        <div class="w-full bg-gray-100 dark:bg-gray-700 h-2 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500 rounded-full" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openGoalModal() {
            document.getElementById('goalForm').reset();
            document.getElementById('goalId').value = '';
            openModal('goalModal');
        }

        function saveGoal(e) {
            e.preventDefault();
            const newGoal = {
                id: Date.now().toString(),
                title: document.getElementById('goalTitle').value,
                target: parseFloat(document.getElementById('goalTarget').value),
                current: parseFloat(document.getElementById('goalCurrent').value),
                deadline: document.getElementById('goalDeadline').value
            };
            state.goals.push(newGoal);
            saveData();
            closeAllModals();
        }

        function deleteGoal(id) {
            if (confirm('Excluir esta meta?')) {
                state.goals = state.goals.filter(g => g.id !== id);
                saveData();
            }
        }

        function renderCategoryOptions() {
            const selects = [document.getElementById('txCategory'), document.getElementById('txCatFilter')];
            selects.forEach(sel => {
                if (!sel) return;
                const isFilter = sel.id === 'txCatFilter';
                sel.innerHTML = isFilter ? '<option value="all">Todas categorias</option>' : '';
                state.categories.forEach(c => {
                    sel.innerHTML += `<option value="${c.name}">${c.name}</option>`;
                });
            });
        }

        function renderCategoryManageList() {
            const list = document.getElementById('categoryManageList');
            list.innerHTML = state.categories.map(c => `
                <div class="flex justify-between items-center py-2 px-3 bg-gray-50 dark:bg-gray-700 rounded-xl">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background:${c.color}"></span>
                        <span class="text-xs font-semibold">${c.name}</span>
                    </div>
                    <button onclick="deleteCategory('${c.id}')" class="text-gray-400 hover:text-rose-500 text-xs">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addCategory(e) {
            e.preventDefault();
            const name = document.getElementById('newCatName').value;
            const color = document.getElementById('newCatColor').value;
            state.categories.push({ id: Date.now().toString(), name, color, limit: 500 });
            document.getElementById('newCatName').value = '';
            saveData();
        }

        function deleteCategory(id) {
            if (confirm('Excluir esta categoria?')) {
                state.categories = state.categories.filter(c => c.id !== id);
                saveData();
            }
        }

        function initChart() {
            const ctx = document.getElementById('categoryChartMobile').getContext('2d');
            state.chart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        function updateChart() {
            if (!state.chart) return;
            const expenses = state.transactions.filter(t => t.type === 'expense');
            const dataMap = {};

            expenses.forEach(t => {
                dataMap[t.category] = (dataMap[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(dataMap);
            const data = Object.values(dataMap);
            const colors = labels.map(l => {
                const cat = state.categories.find(c => c.name === l);
                return cat ? cat.color : '#6366f1';
            });

            state.chart.data.labels = labels;
            state.chart.data.datasets[0].data = data;
            state.chart.data.datasets[0].backgroundColor = colors;
            state.chart.update();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>
</html>
