<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AJ-MyFinance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex justify-center items-center min-h-screen select-none">

    <!-- Container Mobile Full -->
    <div id="app-container" class="w-full max-w-md h-screen md:h-[844px] md:rounded-3xl bg-slate-900 shadow-2xl flex flex-col overflow-hidden relative border border-slate-800">
        
        <!-- Header -->
        <header class="px-6 py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 flex justify-between items-center z-10">
            <div class="flex items-center space-x-3">
                <div onclick="abrirModalPerfil()" class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center font-bold text-white shadow-lg cursor-pointer active:scale-95 transition">
                    AJ
                </div>
                <div>
                    <h1 class="text-xs text-slate-400 font-medium">Bem-vindo de volta,</h1>
                    <p class="text-sm font-bold tracking-tight">AJ-MyFinance</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="mudarMes(-1)" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <span id="label-mes-atual" class="text-xs font-semibold px-2 py-1 bg-slate-800/60 rounded-lg border border-slate-700/50">Mes/Ano</span>
                <button onclick="mudarMes(1)" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </header>

        <!-- Corpo de Abas (Conteúdo Dinâmico) -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 space-y-4">
            <!-- Conteúdo injetado via JavaScript -->
        </main>

        <!-- Botão Flutuante de Ação Rápida -->
        <div class="absolute bottom-20 right-6 z-20">
            <button onclick="abrirModalTransacao()" class="w-14 h-14 bg-brand-600 hover:bg-brand-500 text-white rounded-full flex items-center justify-center shadow-xl shadow-brand-600/30 active:scale-90 transition">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
        </div>

        <!-- Navegação Inferior (Bottom Bar) -->
        <nav class="absolute bottom-0 left-0 right-0 h-16 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex justify-around items-center px-2 z-10">
            <button onclick="mudarAba('inicio')" class="nav-btn flex flex-col items-center justify-center w-16 text-brand-500" data-aba="inicio">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Início</span>
            </button>
            <button onclick="mudarAba('extrato')" class="nav-btn flex flex-col items-center justify-center w-16 text-slate-400 hover:text-slate-200" data-aba="extrato">
                <i class="fa-solid fa-wallet text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Extrato</span>
            </button>
            <button onclick="mudarAba('fixas')" class="nav-btn flex flex-col items-center justify-center w-16 text-slate-400 hover:text-slate-200" data-aba="fixas">
                <i class="fa-solid fa-receipt text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Fixas</span>
            </button>
            <button onclick="mudarAba('limites')" class="nav-btn flex flex-col items-center justify-center w-16 text-slate-400 hover:text-slate-200" data-aba="limites">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Limites</span>
            </button>
            <button onclick="mudarAba('metas')" class="nav-btn flex flex-col items-center justify-center w-16 text-slate-400 hover:text-slate-200" data-aba="metas">
                <i class="fa-solid fa-bullseye text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Metas</span>
            </button>
        </nav>
    </div>

    <!-- Modal de Transação (Receita / Despesa) -->
    <div id="modal-transacao" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-slate-900 w-full max-w-md md:rounded-2xl rounded-t-2xl border border-slate-800 p-6 space-y-4 animate-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-titulo" class="font-bold text-base">Nova Transação</h3>
                <button onclick="fecharModalTransacao()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-transacao" onsubmit="salvarTransacao(event)" class="space-y-4">
                <input type="hidden" id="transacao-id">
                <div class="flex bg-slate-800 p-1 rounded-xl">
                    <button type="button" onclick="setTipoTransacao('despesa')" id="btn-tipo-despesa" class="flex-1 py-2 rounded-lg text-xs font-semibold bg-rose-600 text-white transition">Despesa</button>
                    <button type="button" onclick="setTipoTransacao('receita')" id="btn-tipo-receita" class="flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 transition">Receita</button>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Descrição</label>
                    <input type="text" id="transacao-desc" required placeholder="Ex: Supermercado, Aluguel..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" id="transacao-valor" required placeholder="0,00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Data</label>
                        <input type="date" id="transacao-data" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Categoria</label>
                    <select id="transacao-categoria" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-500">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Salário">Salário</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-brand-600/20">Salvar Transação</button>
            </form>
        </div>
    </div>

    <!-- Modal de Perfil e Backup (Exportar/Importar) -->
    <div id="modal-perfil" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl border border-slate-800 p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-user-gear text-brand-500"></i> Perfil & Dados</h3>
                <button onclick="fecharModalPerfil()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <p class="text-xs text-slate-400 leading-relaxed">Gerencie seus backups para garantir que seus registros mensais nunca sejam perdidos[cite: 4].</p>
                
                <button onclick="exportarBackup()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-xl transition text-sm border border-slate-700">
                    <i class="fa-solid fa-download text-brand-500"></i> Exportar Dados (Backup JSON)
                </button>

                <label class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-xl transition text-sm border border-slate-700 cursor-pointer">
                    <i class="fa-solid fa-upload text-emerald-400"></i> Importar Backup
                    <input type="file" id="input-importar" accept=".json" onchange="importarBackup(event)" class="hidden">
                </label>
            </div>
            <div class="pt-2 border-t border-slate-800/60 text-center">
                <span class="text-[10px] text-slate-500">AJ-MyFinance v2.5 - Mobile Full Persistence</span>
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript Principal -->
    <script>
        // Estado Global da Aplicação
        let estadoApp = {
            abaAtual: 'inicio',
            mesAtual: new Date().toISOString().slice(0, 7), // "AAAA-MM"
            tipoTransacaoAtual: 'despesa',
            dados: {
                transacoes: [],
                fixas: [],
                limites: {},
                metas: []
            }
        };

        // Persistência Dupla (LocalStorage + Coleta Inicial)
        function salvarDados() {
            try {
                localStorage.setItem('aj_myfinance_data', JSON.stringify(estadoApp.dados));
            } catch (e) {
                console.error("Erro ao salvar dados localmente", e);
            }
        }

        function carregarDados() {
            const salvo = localStorage.getItem('aj_myfinance_data');
            if (salvo) {
                try {
                    estadoApp.dados = JSON.parse(salvo);
                } catch (e) {
                    console.error("Erro ao carregar dados", e);
                }
            } else {
                // Dados de Exemplo Iniciais
                estadoApp.dados.transacoes = [
                    { id: '1', desc: 'Salário Empresa', valor: 4500, tipo: 'receita', categoria: 'Salário', data: new Date().toISOString().slice(0,10) },
                    { id: '2', desc: 'Supermercado Mensal', valor: 850, tipo: 'despesa', categoria: 'Alimentação', data: new Date().toISOString().slice(0,10) }
                ];
                salvarDados();
            }
        }

        // Sistema de Backup (Exportar / Importar)
        function exportarBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(estadoApp.dados, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_aj_myfinance_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarBackup(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;
            const leitor = new FileReader();
            leitor.onload = function(e) {
                try {
                    const dadosImportados = JSON.parse(e.target.result);
                    if (dadosImportados && dadosImportados.transacoes) {
                        estadoApp.dados = dadosImportados;
                        salvarDados();
                        renderizarAba();
                        fecharModalPerfil();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Arquivo de backup inválido.");
                    }
                } catch (err) {
                    alert("Erro ao ler o arquivo JSON.");
                }
            };
            leitor.readAsText(arquivo);
        }

        // Navegação por Abas
        function mudarAba(aba) {
            estadoApp.abaAtual = aba;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.aba === aba) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-brand-500');
                } else {
                    btn.classList.remove('text-brand-500');
                    btn.classList.add('text-slate-400');
                }
            });
            renderizarAba();
        }

        function mudarMes(direcao) {
            let [ano, mes] = estadoApp.mesAtual.split('-').map(Number);
            mes += direcao;
            if (mes > 12) { mes = 1; ano++; }
            else if (mes < 1) { mes = 12; ano--; }
            estadoApp.mesAtual = `${ano}-${String(mes).padStart(2, '0')}`;
            atualizarLabelMes();
            renderizarAba();
        }

        function atualizarLabelMes() {
            const [ano, mes] = estadoApp.mesAtual.split('-');
            const dataObj = new Date(ano, mes - 1, 1);
            const nomeMes = dataObj.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            document.getElementById('label-mes-atual').innerText = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);
        }

        // Renderização Dinâmica de Conteúdo
        function renderizarAba() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            switch(estadoApp.abaAtual) {
                case 'inicio': renderInicio(container); break;
                case 'extrato': renderExtrato(container); break;
                case 'fixas': renderFixas(container); break;
                case 'limites': renderLimites(container); break;
                case 'metas': renderMetas(container); break;
            }
        }

        // Filtro por Mês Atual
        function getTransacoesMes() {
            return estadoApp.dados.transacoes.filter(t => t.data && t.data.startsWith(estadoApp.mesAtual));
        }

        // Tela de Início
        function renderInicio(container) {
            const transacoes = getTransacoesMes();
            const receitas = transacoes.filter(t => t.tipo === 'receita').reduce((acc, t) => acc + Number(t.valor), 0);
            const despesas = transacoes.filter(t => t.tipo === 'despesas' || t.tipo === 'despesa').reduce((acc, t) => acc + Number(t.valor), 0);
            const saldo = receitas - despesas;

            container.innerHTML = `
                <!-- Card de Saldo Geral -->
                <div class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-brand-500/10 rounded-full blur-2xl"></div>
                    <p class="text-xs text-slate-400 font-medium">Saldo Disponível no Mês</p>
                    <h2 class="text-2xl font-bold tracking-tight mt-1 text-white">R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h2>
                    
                    <div class="grid grid-cols-2 gap-4 mt-5 pt-4 border-t border-slate-800/80">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-arrow-down text-xs"></i></div>
                            <div>
                                <p class="text-[10px] text-slate-400">Receitas</p>
                                <p class="text-xs font-bold text-emerald-400">R$ ${receitas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-arrow-up text-xs"></i></div>
                            <div>
                                <p class="text-[10px] text-slate-400">Despesas</p>
                                <p class="text-xs font-bold text-rose-400">R$ ${despesas.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Atividades Recentes -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Últimos Lançamentos</h3>
                        <button onclick="mudarAba('extrato')" class="text-xs text-brand-500 font-medium hover:underline">Ver todos</button>
                    </div>
                    <div class="space-y-2">
                        ${transacoes.length === 0 ? '<p class="text-xs text-slate-500 text-center py-6">Nenhum registro neste mês.</p>' : 
                            transacoes.slice(-4).reverse().map(t => `
                                <div class="bg-slate-900 border border-slate-800/80 p-3.5 rounded-xl flex justify-between items-center">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-9 h-9 rounded-xl ${t.tipo === 'receita' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center">
                                            <i class="fa-solid ${t.tipo === 'receita' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs font-semibold">${t.desc}</p>
                                            <p class="text-[10px] text-slate-500">${t.categoria} •${t.data.split('-').reverse().join('/')}</p>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold ${t.tipo === 'receita' ? 'text-emerald-400' : 'text-rose-400'}">
                                        ${t.tipo === 'receita' ? '+' : '-'} R$ ${Number(t.valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                                    </span>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;
        }

        // Tela de Extrato
        function renderExtrato(container) {
            const transacoes = getTransacoesMes();
            container.innerHTML = `
                <div class="space-y-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Extrato Completo do Mês</h3>
                    <div class="space-y-2">
                        ${transacoes.length === 0 ? '<p class="text-xs text-slate-500 text-center py-10">Nenhuma transação encontrada.</p>' : 
                            transacoes.map(t => `
                                <div class="bg-slate-900 border border-slate-800/80 p-3.5 rounded-xl flex justify-between items-center">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-9 h-9 rounded-xl ${t.tipo === 'receita' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} flex items-center justify-center">
                                            <i class="fa-solid ${t.tipo === 'receita' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                                        </div>
                                        <div>
                                            <p class="text-xs font-semibold">${t.desc}</p>
                                            <p class="text-[10px] text-slate-500">${t.categoria} •${t.data.split('-').reverse().join('/')}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-3">
                                        <span class="text-xs font-bold ${t.tipo === 'receita' ? 'text-emerald-400' : 'text-rose-400'}">
                                            ${t.tipo === 'receita' ? '+' : '-'} R$ ${Number(t.valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                                        </span>
                                        <button onclick="deletarTransacao('${t.id}')" class="text-slate-600 hover:text-rose-400 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;
        }

        // Demais telas simplificadas para robustez mobile
        function renderFixas(container) {
            container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">Contas fixas e recorrentes em breve.</div>`;
        }
        function renderLimites(container) {
            container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">Controle de limites por categoria.</div>`;
        }
        function renderMetas(container) {
            container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">Gerenciador de Metas Financeiras.</div>`;
        }

        // Manipulação de Modais
        function abrirModalTransacao() {
            document.getElementById('transacao-id').value = '';
            document.getElementById('transacao-desc').value = '';
            document.getElementById('transacao-valor').value = '';
            document.getElementById('transacao-data').value = new Date().toISOString().slice(0,10);
            document.getElementById('modal-transacao').classList.remove('hidden');
        }
        function fecharModalTransacao() { document.getElementById('modal-transacao').classList.add('hidden'); }

        function setTipoTransacao(tipo) {
            estadoApp.tipoTransacaoAtual = tipo;
            const btnDesp = document.getElementById('btn-tipo-despesa');
            const btnRec = document.getElementById('btn-tipo-receita');
            if(tipo === 'despesa') {
                btnDesp.className = "flex-1 py-2 rounded-lg text-xs font-semibold bg-rose-600 text-white transition";
                btnRec.className = "flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 transition";
            } else {
                btnRec.className = "flex-1 py-2 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition";
                btnDesp.className = "flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 transition";
            }
        }

        function salvarTransacao(e) {
            e.preventDefault();
            const nova = {
                id: Date.now().toString(),
                desc: document.getElementById('transacao-desc').value,
                valor: parseFloat(document.getElementById('transacao-valor').value),
                tipo: estadoApp.tipoTransacaoAtual,
                categoria: document.getElementById('transacao-categoria').value,
                data: document.getElementById('transacao-data').value
            };
            estadoApp.dados.transacoes.push(nova);
            salvarDados();
            fecharModalTransacao();
            renderizarAba();
        }

        function deletarTransacao(id) {
            estadoApp.dados.transacoes = estadoApp.dados.transacoes.filter(t => t.id !== id);
            salvarDados();
            renderizarAba();
        }

        function abrirModalPerfil() { document.getElementById('modal-perfil').classList.remove('hidden'); }
        function fecharModalPerfil() { document.getElementById('modal-perfil').classList.add('hidden'); }

        // Inicialização
        window.onload = function() {
            carregarDados();
            atualizarLabelMes();
            renderizarAba();
        };
    </script>
</body>
</html>
